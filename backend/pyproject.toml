[project]
name = "ga-dashboard-backend"
version = "0.1.0"
description = "Google Analytics Dashboard — FastAPI backend"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "google-auth==2.36.0",
    "google-auth-oauthlib==1.2.1",
    "google-analytics-data==0.18.14",
    "python-dotenv==1.0.1",
    "httpx==0.28.0",
    "itsdangerous==2.2.0",
    "starlette==0.41.3",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "httpx>=0.28.0",
    "mypy>=1.13",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

filterwarnings = [
    "ignore::DeprecationWarning:starlette.testclient",
    "ignore:You are using a Python version:FutureWarning",
]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["app", "tests"]
# Google client libraries ship without complete type information.
[[tool.mypy.overrides]]
module = ["google.*", "google_auth_oauthlib.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["app.providers", "tests.test_google_provider"]
disallow_untyped_calls = false

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF012", "RUF002", "RUF003"]  # × in docs/comments is intentional

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
